<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write-Off scene gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 16px; background: #1b1b1f; color: #f6f3ea; font-family: VT323, "Courier New", monospace; font-size: 20px; }
  h1 { font-family: "Press Start 2P", monospace; font-size: 14px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  figure { margin: 0; }
  figure svg { display: block; width: 100%; height: auto; border: 2px solid #5d5d66; image-rendering: pixelated; }
  figcaption { font-family: "Press Start 2P", monospace; font-size: 9px; color: #f2c14e; margin: 6px 0 0; }
  .small svg { width: 128px; }
  .blink { animation: blink 1.2s steps(2) infinite; }
  .car { transform: translateX(260px); }
  .puff { opacity: 1; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<h1>Scene gallery</h1>
<div class="grid" id="grid"></div>
<script src="../scenes.js"></script>
<script>
  var S = window.WRITEOFF_SCENES;
  var names = ['lot', 'freeway', 'hollywood', 'sunset', 'century', 'culver', 'santamonica', 'griffith', 'capitol', 'downtown'];
  var html = names.map(function (n) {
    return '<figure>' + S[n]({ car: true, label: n }) + '<figcaption>' + n + '</figcaption></figure>';
  }).join('');
  html += '<figure class="small">' + S.tombstone() + '<figcaption>tombstone</figcaption></figure>';
  ['junker', 'rental', 'town car', 'limo'].forEach(function (name, tier) {
    html += '<figure><svg viewBox="-20 -4 72 32" width="320" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" style="background:#5d5d66">' + S.car(tier) + '</svg><figcaption>car tier ' + tier + ': ' + name + '</figcaption></figure>';
  });
  document.getElementById('grid').innerHTML = html;
</script>
</body>
</html>
